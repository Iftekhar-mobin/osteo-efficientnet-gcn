<text x="672.5" y="268.13599999999997" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.3"  fill="#1E293B">10×10 grid, 1280 channels/patch</text>
<text x="672.5" y="288.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9.0" fill="#475569">F ∈ ℝ¹⁰ˣ¹⁰ˣ¹²⁸⁰</text>
