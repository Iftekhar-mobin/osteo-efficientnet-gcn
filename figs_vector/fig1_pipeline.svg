<text x="315.0" y="100.636" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.3"  fill="#1E293B">CLAHE @ native res</text>
<text x="315.0" y="113.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9.0" fill="#475569">→ 320×320×3</text>
