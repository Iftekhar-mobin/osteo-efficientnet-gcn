<text x="370.0" y="260.236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.3"  fill="#1E293B">(ImageNet-init.; last 6 of 9</text>
<text x="370.0" y="276.036" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.3"  fill="#1E293B">blocks trainable)</text>
