<text x="130.0" y="288.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9.0" fill="#475569">I ∈ ℝ³ˣ³²⁰ˣ³²⁰</text>
<rect x="240" y="215" width="260" height="90" rx="10" ry="10" fill="#DCEEFF" stroke="#2563EB" stroke-width="1.6"/>
