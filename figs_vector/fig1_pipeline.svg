<rect x="0" y="0" width="1000" height="680" fill="white"/>

<rect x="30" y="20" width="940" height="130" rx="14" ry="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6,4"/>
