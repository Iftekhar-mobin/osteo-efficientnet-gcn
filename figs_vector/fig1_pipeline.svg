<text x="512.5" y="100.636" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.3"  fill="#1E293B">70% / 15% / 15% (originals)</text>
<text x="512.5" y="113.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9.0" fill="#475569">1362 / 292 / 293</text>
<rect x="635" y="55" width="245" height="75" rx="10" ry="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
<text x="757.5" y="84.836" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="600" fill="#1E293B">Class-Balancing Augmentation</text>
<text x="757.5" y="100.636" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.3"  fill="#1E293B">TRAIN split only</text>
<text x="757.5" y="113.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9.0" fill="#475569">1,000/class → train n=3,000</text>
