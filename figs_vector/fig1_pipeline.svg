<text x="740.0" y="525.636" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.3"  fill="#1E293B">ReLU + Dropout</text>
<text x="740.0" y="538.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9.0" fill="#475569">logits z_CNN</text>
